<script id="fs" type="x-shader">#version 300 es
precision highp float;precision highp int;precision highp sampler3D;precision highp usampler3D;
uniform usampler3D uB;uniform sampler3D uL;
uniform vec2 uRes;uniform vec3 uPos,uFwd,uRight,uUp,uSun,uSunCol,uAmb,uHor,uZen;
uniform float uTan,uDist;uniform int uRT,uBounces,uShadow,uFog;uniform ivec3 uSel;uniform vec4 uM[64];uniform vec4 uPl;uniform float uWS,uIor;uniform int uWarp;
out vec4 fc;vec3 gH;float gEd;
uint blk(ivec3 c){if(c.y<0)return 9u;if(c.y>=40)return 0u;return texelFetch(uB,ivec3(c.x&127,c.y,c.z&127),0).r;}

vec3 tintOf(uint b){return b==11u?vec3(1.,.25,.25):b==12u?vec3(.3,1.,.35):b==13u?vec3(.3,.5,1.):b==14u?vec3(1.,.9,.3):vec3(.97,1.,1.);}

void mat(uint b,vec3 p,vec3 n,out vec3 a,out float rf,out float fr){

 else if(b==2u)a=vec3(.5,.35,.22)*v;
 else if(b==3u)a=vec3(.5)*(.85+.3*r);
 else if(b==4u){int o=((q.y/5)&1)*3;bool m=(q.x+o)%6==0||q.y%5==0;a=m?vec3(.27):vec3(.5)*(.8+.35*hs(ivec2((q.x+o)/6,q.y/5),4));}
 else if(b==5u){a=vec3(.72,.55,.32)*v;if(q.y%4==3)a*=.7;}
 else if(b==6u){bool m=(q.y&3)==3||(q.x+((q.y/4)&1)*4)%8==0;a=m?vec3(.72,.7,.65)*(.9+.2*r):vec3(.6,.25,.18)*v;}
 else if(b==7u)a=vec3(.86,.8,.55)*(.9+.2*r);

 else if(b==15u){a=vec3(1.,.8,.35)*(.92+.08*r);if(gEd<.0625)a*=1.2;rf=.65;}
 else if(b==16u){if(gEd<.0625){a=vec3(.35,.38,.42);rf=.35;}else{a=vec3(.02);rf=.97;}}

bool march(vec3 ro,vec3 rd,float mt,out float t,out vec3 n,out ivec3 c,out uint b){

 for(int i=0;i<500;i++){
  b=blk(c);if(b!=0u){
  if(!(b>=32u&&uM[(b-32u)*2u].w>.5)){if(dot(n,n)<.5)n=-rd;return true;}
  vec3 oc=ro-vec3(c)-.5;float bq=dot(oc,rd),dq=bq*bq-dot(oc,oc)+.25;
  if(dq>=0.&&-bq-sqrt(dq)>=0.){t=-bq-sqrt(dq);n=normalize(ro+rd*t-vec3(c)-.5);return true;}
 }

  else{t=tm.z;tm.z+=ird.z;c.z+=s.z;n=vec3(0.,0.,-float(s.z));}

}
vec3 warp(vec3 n,vec3 p,float a){return normalize(n+a*vec3(sin(p.y*11.+p.z*7.),sin(p.z*9.+p.x*13.),sin(p.x*10.+p.y*8.)));}
const vec3 PB[6]=vec3[6](vec3(-.25,1.4,-.25),vec3(-.25,.7,-.125),vec3(-.5,.7,-.125),vec3(.25,.7,-.125),vec3(-.25,0.,-.125),vec3(0.,0.,-.125));
const vec3 PS[6]=vec3[6](vec3(.5),vec3(.5,.7,.25),vec3(.25,.7,.25),vec3(.25,.7,.25),vec3(.25,.7,.25),vec3(.25,.7,.25));
const vec3 PC[6]=vec3[6](vec3(.85,.65,.5),vec3(.2,.55,.8),vec3(.85,.65,.5),vec3(.85,.65,.5),vec3(.25,.25,.6),vec3(.25,.25,.6));

 vec3 R=vec3(cos(uPl.w),0.,sin(uPl.w)),F=vec3(sin(uPl.w),0.,-cos(uPl.w));

  vec3 a=(PB[i]-lo)*iv,b=(PB[i]+PS[i]-lo)*iv,tn=min(a,b),tf=max(a,b);

}
vec3 shadow(vec3 ro){

  if(c.y>=40)break;uint b=blk(c);
  if(b!=0u){if(isG(b))tp*=tintOf(b)*.92;else return vec3(0.);}
  if(tm.x<tm.y&&tm.x<tm.z){c.x+=s.x;tm.x+=ird.x;}else if(tm.y<tm.z){c.y+=s.y;tm.y+=ird.y;}else{c.z+=s.z;tm.z+=ird.z;}
 }

}
vec3 skyc(vec3 d){return mix(uHor,uZen,pow(clamp(d.y,0.,1.),.55))+uSunCol*pow(max(dot(d,uSun),0.),500.)*30.;}
void main(){

  if(i>=md){col+=tp*skyc(rd);break;}
  float t;vec3 n;ivec3 c;uint b;
  bool hh=march(ro,rd,uDist-td,t,n,c,b);vec3 pn2,pc2;float tpl=(i>0&&uRT==1)?player(ro,rd,pn2,pc2):1e9;

  if(i==0&&c==uSel&&gEd<.03){col=vec3(0.);break;}

  if(cm){int mi=int(b-32u)*2;vec4 m0=uM[mi],m1=uM[mi+1];al=m0.rgb;sph=m0.w>.5;tr=m1.x;rgh=m1.y;rf=(1.-rgh)*.95;wa=m1.z>.5?uWS:0.;}else if(isG(b)&&uWarp==1)wa=uWS;
  vec3 nw=(uRT==1&&wa>0.)?warp(n,p,wa):n;
  if(isG(b)){
   col+=tp*fr*(.35+.5*al);
   float F=.04+.96*pow(1.-clamp(dot(-rd,nw),0.,1.),5.);
   if(uRT==1){col+=tp*F*skyc(reflect(rd,nw));tp*=1.-F;}
   vec3 r1=uRT==1?refract(rd,nw,1./uIor):rd;
   vec3 lo=p-vec3(c);vec3 sg=step(vec3(0.),r1);
   vec3 ex=(sg-lo)/(r1+vec3(1e-6)*(sg*2.-1.));
   float t2=max(min(min(ex.x,ex.y),ex.z),1e-4);
   vec3 m=step(ex,ex.yzx)*step(ex,ex.zxy);m/=dot(m,vec3(1.));
   vec3 on=m*sign(r1+vec3(1e-9));
   vec3 r2=uRT==1?refract(r1,-on,uIor):r1;if(dot(r2,r2)<.5)r2=reflect(r1,-on);

  }

  float fg=uFog==1?smoothstep(.55,1.,td/uDist):0.;
  vec3 pn=p+n*.004;float ndl=max(dot(n,uSun),0.);

  vec3 lit=uAmb*(.75+.25*n.y)+uSunCol*ndl*sv+bl;
  if(b==17u){col+=tp*mix(al*2.2,uHor,fg);break;}
  if(cm&&tr>0.){
   col+=tp*(1.-tr)*al*lit;
   float F=.04+.96*pow(1.-clamp(dot(-rd,nw),0.,1.),5.);
   if(uRT==1){col+=tp*tr*F*skyc(reflect(rd,nw));tp*=1.-F;}
   vec3 r1=uRT==1?refract(rd,nw,1./uIor):rd,on;float t2;
   if(sph){vec3 oc=p-vec3(c)-.5;float bq=dot(oc,r1);t2=max(-bq+sqrt(max(bq*bq-dot(oc,oc)+.25,0.)),1e-4);on=normalize(p+r1*t2-vec3(c)-.5);}
   else{vec3 sg=step(vec3(0.),r1),ex=(sg-(p-vec3(c)))/(r1+vec3(1e-6)*(sg*2.-1.));t2=max(min(min(ex.x,ex.y),ex.z),1e-4);vec3 m=step(ex,ex.yzx)*step(ex,ex.zxy);on=m/dot(m,vec3(1.))*sign(r1+vec3(1e-9));}
   vec3 r2=uRT==1?refract(r1,-on,uIor):r1;if(dot(r2,r2)<.5)r2=reflect(r1,-on);

  }

   col+=tp*(1.-rf)*al*lit;vec3 rr=reflect(rd,nw);if(cm){ivec2 fp=ivec2(gl_FragCoord.xy);rr=normalize(rr+rgh*rgh*(vec3(hs(fp,1),hs(fp,2),hs(fp,3))*2.-1.));if(dot(rr,n)<0.)rr=reflect(rr,n);}vec3 rt=(b==15u||cm)?al:vec3(1.);

}

<script>
