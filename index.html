<script id="fs" type="x-shader">#version 300 es

const float THR=.35;
float dens(vec3 p){vec3 q=(p-uGO)/uGS;if(any(lessThan(q,vec3(0.)))||any(greaterThan(q,vec3(1.))))return 0.;return texture(uD,q).r;}

void mexit(vec3 p,vec3 r,out float te,out vec3 ne){
